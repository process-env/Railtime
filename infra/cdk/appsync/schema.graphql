type RouteMetric {
  routeId: String!
  direction: String
  timestamp: AWSTimestamp!
  trainCount: Int!
  avgDelaySeconds: Float
  onTimePercent: Float
  headwayAvgSeconds: Float
  headwayMedianSeconds: Float
  bunchingCount: Int
  gapCount: Int
  feedLatencyMs: Int
  feedStatus: String
}

type DailyRollup {
  routeId: String!
  direction: String
  date: String!
  avgDelay: Float
  onTimePercent: Float
  peakTrainCount: Int
  totalAlerts: Int
  avgHeadway: Float
  medianHeadway: Float
  totalTrips: Int
  totalBunching: Int
  totalGaps: Int
  totalSkippedStops: Int
}

type FeedGroupHealth {
  feedGroupId: String!
  status: String!
  latencyMs: Int
  trainCount: Int
}

type SystemHealth {
  timestamp: AWSTimestamp!
  activeTrains: Int!
  feedGroups: [FeedGroupHealth!]!
  alertCount: Int!
}

type TripEvent {
  pk: String!
  timestamp: AWSTimestamp!
  tripId: String
  description: String
}

type Query {
  getRouteMetrics(routeId: String!, direction: String, from: AWSTimestamp!, to: AWSTimestamp!): [RouteMetric!]!
  getDailyRollups(routeId: String, direction: String, from: String!, to: String!): [DailyRollup!]!
  getLatestSystemHealth: SystemHealth
  getTripEvents(routeId: String!, direction: String, from: AWSTimestamp!, to: AWSTimestamp!, eventType: String): [TripEvent!]!
}

type Subscription {
  onRouteMetricUpdate(routeId: String): RouteMetric
    @aws_subscribe(mutations: ["publishRouteMetric"])
}

type Mutation {
  publishRouteMetric(
    routeId: String!
    direction: String
    timestamp: AWSTimestamp!
    trainCount: Int!
    avgDelaySeconds: Float
    onTimePercent: Float
    headwayAvgSeconds: Float
    headwayMedianSeconds: Float
    bunchingCount: Int
    gapCount: Int
    feedLatencyMs: Int
    feedStatus: String
  ): RouteMetric
}
